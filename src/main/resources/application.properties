spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civiclens}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vadlavishnuvaradhanachari}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
civiclens.jwt.secret=${JWT_SECRET:mySecretKeyForJwtAuthenticationMustBeAtLeast32CharactersLong}
civiclens.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Provisioning
civiclens.admin.email=${ADMIN_EMAIL:admin@civiclens.gov}
civiclens.admin.password=${ADMIN_PASSWORD:Admin@12345}
civiclens.admin.name=${ADMIN_NAME:System Administrator}

# Multipart / File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# CivicLens Media Storage Properties
civiclens.upload.dir=${UPLOAD_DIR:uploads}
civiclens.upload.max-size-bytes=5242880
civiclens.upload.allowed-extensions=jpg,jpeg,png,webp
civiclens.upload.base-url=/uploads
