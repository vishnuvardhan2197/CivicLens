spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civiclens}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vadlavishnuvaradhanachari}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicit Dialect prevents Hibernate metadata dialect lookup failures
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hikari Connection Pool Settings for Cloud Stability
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
civiclens.jwt.secret=${JWT_SECRET:mySecretKeyForJwtAuthenticationMustBeAtLeast32CharactersLong}
civiclens.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Provisioning
civiclens.admin.email=${ADMIN_EMAIL:admin@civiclens.gov}
civiclens.admin.password=${ADMIN_PASSWORD:Admin@12345}
civiclens.admin.name=${ADMIN_NAME:System Administrator}

# CORS Configuration (Comma-separated origins or patterns)
civiclens.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Multipart / File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# CivicLens Media Storage Properties (Local Fallback)
civiclens.upload.dir=${UPLOAD_DIR:uploads}
civiclens.upload.max-size-bytes=5242880
civiclens.upload.allowed-extensions=jpg,jpeg,png,webp
civiclens.upload.base-url=/uploads

# Cloud Media Storage (Cloudinary - ensures photographs persist after redeployment)
civiclens.cloudinary.url=${CLOUDINARY_URL:}
civiclens.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
civiclens.cloudinary.api-key=${CLOUDINARY_API_KEY:}
civiclens.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
